# 声明「无限定 res/values/」目录里的资源语言 = 英文（en）。
# 配合 build.gradle.kts 的 androidResources.generateLocaleConfig = true，让「系统 ▸ 应用语言」列出 English + 简体中文。
#
# i18n 标准结构（方案②，全 API 生效）：
#   英文 = 默认 res/values/（无限定，也是任何未支持语言的兜底）；
#   中文 = 显式 res/values-zh-rCN/。
# zh-CN 请求会「精确命中」res/values-zh-rCN（arsc 里有确切的 zh 标签），不依赖只有 API 35+ 才认的
# android:defaultLocale，所以 API 29–36 全部正确——选简体中文界面就是中文、选 English 就是英文。
unqualifiedResLocale=en
